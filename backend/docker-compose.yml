services:
  app:
    build: .
    container_name: doc_backend
    restart: always
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./dev_emails:/app/dev_emails
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - mongo
      - qdrant
      - redis
      - ollama
      - unstructured
    networks:
      - backend_network

  worker_documents:
    build: .
    container_name: doc_worker_documents
    restart: always
    volumes:
      - ./app:/app/app
    env_file:
      - .env
    command: [ "celery", "-A", "app.celery_app", "worker", "-Q", "default", "--loglevel=info", "--concurrency=4", "--without-gossip", "--without-mingle", "--without-heartbeat", "-Ofair" ]
    depends_on:
      - mongo
      - qdrant
      - redis
    networks:
      - backend_network

  worker_scraping:
    build: .
    container_name: doc_worker_scraping
    restart: always
    volumes:
      - ./app:/app/app
    env_file:
      - .env
    command: [ "celery", "-A", "app.celery_app", "worker", "-Q", "scraping", "--loglevel=info", "--concurrency=2", "--without-gossip", "--without-mingle", "--without-heartbeat", "-Ofair" ]
    depends_on:
      - mongo
      - qdrant
      - redis
    networks:
      - backend_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: doc_qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend_network

  mongo:
    image: mongo:latest
    container_name: doc_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - backend_network

  redis:
    image: redis:alpine
    container_name: doc_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - backend_network

  unstructured:
    image: downloads.unstructured.io/unstructured-io/unstructured-api:latest
    container_name: doc_unstructured
    restart: always
    ports:
      - "8001:8000"
    networks:
      - backend_network

  ollama:
    image: ollama/ollama:latest
    container_name: doc_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge

volumes:
  qdrant_data:
  mongo_data:
  ollama_data:
